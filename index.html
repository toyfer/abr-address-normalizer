<!DOCTYPE html>
<html lang="ja" data-theme="system">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>住所正規化ツール（アドレス・ベース・レジストリ）</title>
<style>
  /* ---- ライト（既定） ---- */
  :root,
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1a1d21;
    --muted: #5c6570;
    --border: #d0d5dc;
    --border-strong: #b8c0ca;
    --th-bg: #eef1f5;
    --input-bg: #ffffff;
    --btn-bg: #ffffff;
    --btn-hover: #eef1f5;
    --btn-primary-bg: #1a56db;
    --btn-primary-text: #ffffff;
    --btn-primary-hover: #1648b8;
    --pre-bg: #f0f2f5;
    --error: #c62828;
    --ok: #1b7a3d;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --focus: #1a56db;
    --chip-bg: #ffffff;
    --chip-hover: #e8edf5;
    --header-border: #e3e7ed;
  }

  /* ---- ダーク ---- */
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1218;
    --surface: #1a1f29;
    --text: #e8eaed;
    --muted: #9aa3b2;
    --border: #2e3644;
    --border-strong: #3d4758;
    --th-bg: #222833;
    --input-bg: #141820;
    --btn-bg: #222833;
    --btn-hover: #2c3442;
    --btn-primary-bg: #3b82f6;
    --btn-primary-text: #ffffff;
    --btn-primary-hover: #2563eb;
    --pre-bg: #141820;
    --error: #f87171;
    --ok: #4ade80;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 1px 3px rgba(0, 0, 0, .35);
    --focus: #60a5fa;
    --chip-bg: #222833;
    --chip-hover: #2c3442;
    --header-border: #2e3644;
  }

  /* システム設定に合わせる（OS がダークのときだけダーク変数を適用） */
  @media (prefers-color-scheme: dark) {
    [data-theme="system"] {
      color-scheme: dark;
      --bg: #0f1218;
      --surface: #1a1f29;
      --text: #e8eaed;
      --muted: #9aa3b2;
      --border: #2e3644;
      --border-strong: #3d4758;
      --th-bg: #222833;
      --input-bg: #141820;
      --btn-bg: #222833;
      --btn-hover: #2c3442;
      --btn-primary-bg: #3b82f6;
      --btn-primary-text: #ffffff;
      --btn-primary-hover: #2563eb;
      --pre-bg: #141820;
      --error: #f87171;
      --ok: #4ade80;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 1px 3px rgba(0, 0, 0, .35);
      --focus: #60a5fa;
      --chip-bg: #222833;
      --chip-hover: #2c3442;
      --header-border: #2e3644;
    }
  }

  * { box-sizing: border-box; }

  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, system-ui, sans-serif;
    max-width: 860px;
    margin: 0 auto;
    padding: 1.5rem 1rem 4rem;
    line-height: 1.6;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: .25rem;
  }

  h1 {
    font-size: 1.4rem;
    margin: 0 0 .25rem;
    font-weight: 700;
    letter-spacing: .01em;
  }

  p.lead {
    margin: 0;
    color: var(--muted);
    font-size: .9rem;
  }

  /* テーマ切替 */
  .theme-toggle {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: var(--shadow);
    flex-shrink: 0;
  }

  .theme-toggle button {
    border: none;
    border-radius: 0;
    background: transparent;
    color: var(--muted);
    font-size: .8rem;
    padding: .4rem .7rem;
    cursor: pointer;
    line-height: 1.2;
  }

  .theme-toggle button + button {
    border-left: 1px solid var(--border);
  }

  .theme-toggle button:hover {
    background: var(--btn-hover);
    color: var(--text);
  }

  .theme-toggle button[aria-pressed="true"] {
    background: var(--btn-primary-bg);
    color: var(--btn-primary-text);
  }

  .theme-toggle button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: -2px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-top: 1.25rem;
    box-shadow: var(--shadow);
  }

  /* ---- タブ ---- */
  .tabs {
    display: flex;
    gap: .25rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.1rem;
  }

  .tabs button {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: .95rem;
    padding: .5rem .95rem;
    border-radius: 8px 8px 0 0;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    cursor: pointer;
  }

  .tabs button:hover { color: var(--text); background: var(--btn-hover); }

  .tabs button[aria-selected="true"] {
    color: var(--text);
    border-bottom-color: var(--btn-primary-bg);
    font-weight: 600;
  }

  .tabs button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: -2px;
  }

  form {
    display: flex;
    gap: .5rem;
    flex-wrap: wrap;
  }

  input[type=text] {
    flex: 1 1 280px;
    font-size: 1rem;
    padding: .6rem .85rem;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--text);
  }

  input[type=text]::placeholder,
  textarea::placeholder { color: var(--muted); }

  input[type=text]:focus,
  textarea:focus {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
    border-color: var(--focus);
  }

  textarea {
    width: 100%;
    font-family: inherit;
    font-size: .95rem;
    line-height: 1.55;
    padding: .6rem .85rem;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--text);
    resize: vertical;
    min-height: 9rem;
  }

  .hint {
    margin: 0 0 .5rem;
    font-size: .82rem;
    color: var(--muted);
  }

  button {
    font-size: 1rem;
    padding: .6rem 1.15rem;
    cursor: pointer;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--btn-bg);
    color: var(--text);
  }

  button:hover { background: var(--btn-hover); }

  button:disabled { opacity: .55; cursor: wait; }

  button.primary {
    background: var(--btn-primary-bg);
    color: var(--btn-primary-text);
    border-color: transparent;
    font-weight: 600;
  }

  button.primary:hover { background: var(--btn-primary-hover); }

  button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .examples {
    margin: .85rem 0 0;
    font-size: .85rem;
    color: var(--muted);
  }

  .examples button {
    font-size: .8rem;
    padding: .2rem .7rem;
    border-radius: 999px;
    margin: .2rem .2rem 0 0;
    background: var(--chip-bg);
    border-color: var(--border);
  }

  .examples button:hover { background: var(--chip-hover); }

  #status,
  #batch-status {
    min-height: 1.2em;
    color: var(--muted);
    font-size: .9rem;
    margin: .75rem 0 .25rem;
  }

  #batch-progress-wrap {
    display: none;
    align-items: center;
    gap: .75rem;
    margin: .5rem 0 .25rem;
  }

  #batch-progress-wrap.active { display: flex; }

  progress {
    flex: 1;
    height: 8px;
    accent-color: var(--btn-primary-bg);
  }

  #batch-progress-label {
    font-size: .85rem;
    color: var(--muted);
    white-space: nowrap;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    margin-top: .5rem;
    font-size: .95rem;
  }

  th, td {
    border: 1px solid var(--border);
    padding: .55rem .8rem;
    text-align: left;
    vertical-align: top;
  }

  th {
    background: var(--th-bg);
    white-space: nowrap;
    font-weight: 600;
    color: var(--text);
  }

  td { background: var(--surface); color: var(--text); }

  td.copy-cell {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: .5rem;
    padding: .45rem .8rem;
  }

  td.copy-cell .val { flex: 1; word-break: break-all; }

  td.copy-cell button {
    font-size: .75rem;
    padding: .15rem .55rem;
    flex-shrink: 0;
  }

  .batch-table { font-size: .85rem; }
  .batch-table th, .batch-table td { word-break: break-all; white-space: normal; }
  .batch-table .num { text-align: right; white-space: nowrap; }
  .batch-table .err { color: var(--error); }
  .batch-table .ok { color: var(--ok); white-space: nowrap; }

  .summary {
    margin: .9rem 0 .1rem;
    font-size: .9rem;
    color: var(--muted);
  }

  .summary strong { color: var(--text); }

  .batch-actions {
    display: flex;
    gap: .5rem;
    flex-wrap: wrap;
    margin-top: .9rem;
  }

  .batch-actions button { font-size: .85rem; padding: .45rem .9rem; }

  .json-label {
    margin: 1.25rem 0 .4rem;
    font-size: .85rem;
    color: var(--muted);
  }

  pre {
    background: var(--pre-bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 1rem;
    overflow: auto;
    border-radius: 8px;
    font-size: .82rem;
    line-height: 1.45;
    margin: 0;
  }

  .error {
    color: var(--error);
    font-weight: 600;
    margin: .5rem 0 0;
  }

  footer {
    margin-top: 2.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--header-border);
    font-size: .8rem;
    color: var(--muted);
  }

  footer a {
    color: var(--btn-primary-bg);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  @media (max-width: 520px) {
    .topbar { flex-direction: column; align-items: stretch; }
    .theme-toggle { align-self: flex-end; }
    th { font-size: .8rem; }
    .batch-table { font-size: .78rem; }
    th, td { padding: .4rem .5rem; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>住所正規化ツール</h1>
    <p class="lead">入力した住所を「アドレス・ベース・レジストリ（ABR）」の正規表記へ変換して表示します</p>
  </div>
  <div class="theme-toggle" role="group" aria-label="表示テーマ">
    <button type="button" data-theme-set="light" title="ライト">ライト</button>
    <button type="button" data-theme-set="dark" title="ダーク">ダーク</button>
    <button type="button" data-theme-set="system" title="OS の設定に合わせる">自動</button>
  </div>
</div>

<div class="card">
  <div class="tabs" role="tablist" aria-label="処理モード">
    <button type="button" role="tab" id="tab-single" aria-selected="true" aria-controls="panel-single">1件ずつ処理</button>
    <button type="button" role="tab" id="tab-batch" aria-selected="false" aria-controls="panel-batch">一括処理</button>
  </div>

  <!-- ========== 1件ずつ処理 ========== -->
  <section id="panel-single" role="tabpanel" aria-labelledby="tab-single">
    <form id="form">
      <input id="address" type="text" placeholder="例: 東京都千代田区紀尾井町1-3" autocomplete="off" required />
      <button id="submit-btn" class="primary" type="submit">正規化</button>
    </form>

    <p class="examples">
      例:
      <button type="button" class="ex">東京都千代田区紀尾井町1-3</button>
      <button type="button" class="ex">北海道札幌市西区24-2-2-3-3</button>
      <button type="button" class="ex">東京都千代田区永田町1丁目6番1号</button>
    </p>

    <div id="status" aria-live="polite"></div>
    <div id="result"></div>
  </section>

  <!-- ========== 一括処理 ========== -->
  <section id="panel-batch" role="tabpanel" aria-labelledby="tab-batch" hidden>
    <p class="hint">住所を1行に1件ずつ入力してください（最大 <span id="max-lines-label">500</span> 件）。空行は無視されます。</p>
    <textarea id="batch-input" placeholder="東京都千代田区紀尾井町1-3&#10;北海道札幌市西区24-2-2-3-3&#10;東京都千代田区永田町1丁目6番1号"></textarea>

    <div class="batch-actions" style="margin-top:.75rem">
      <button id="batch-btn" class="primary" type="button">一括実行</button>
      <button id="batch-clear-btn" type="button">入力をクリア</button>
    </div>

    <div id="batch-status" aria-live="polite"></div>
    <div id="batch-progress-wrap">
      <progress id="batch-progress" max="1" value="0"></progress>
      <span id="batch-progress-label"></span>
    </div>
    <div id="batch-result"></div>
  </section>
</div>

<footer>
  正規化エンジン: <a href="https://github.com/geolonia/normalize-japanese-addresses">@geolonia/normalize-japanese-addresses</a>（MIT License）<br>
  データソース: デジタル庁「アドレス・ベース・レジストリ」（CC BY 4.0 相当の公開データ）<br>
  このページは住所入力をブラウザ内で処理する静的アプリです（ビルド不要・APIキー不要）。
</footer>

<script type="module">
  import { normalize } from 'https://cdn.jsdelivr.net/npm/@geolonia/normalize-japanese-addresses@3.1.3/dist/main-esm.mjs';

  const MAX_BATCH_LINES = 500;

  // ---- テーマ ----
  const THEME_KEY = 'abr-theme';
  const root = document.documentElement;
  const themeButtons = document.querySelectorAll('[data-theme-set]');

  function applyTheme(theme) {
    const next = ['light', 'dark', 'system'].includes(theme) ? theme : 'system';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch { /* ignore */ }
    themeButtons.forEach(b => {
      b.setAttribute('aria-pressed', b.dataset.themeSet === next ? 'true' : 'false');
    });
  }

  let saved = 'system';
  try { saved = localStorage.getItem(THEME_KEY) || 'system'; } catch { /* ignore */ }
  applyTheme(saved);

  themeButtons.forEach(b => {
    b.addEventListener('click', () => applyTheme(b.dataset.themeSet));
  });

  // ---- タブ切替 ----
  const tabButtons = document.querySelectorAll('.tabs button');
  function selectTab(name) {
    tabButtons.forEach(b => {
      const on = (b.id === `tab-${name}`);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      document.getElementById(b.getAttribute('aria-controls')).hidden = !on;
    });
  }
  tabButtons.forEach(b => {
    b.addEventListener('click', () => selectTab(b.id.replace('tab-', '')));
  });

  // ---- 共通 ----
  const LEVEL_DESC = {
    0: '都道府県も判別できなかった',
    1: '都道府県名まで判別できた',
    2: '市区町村名まで判別できた',
    3: '町丁目（大字・丁目）まで判別できた',
    8: '街区符号・住居符号または地番まで判別できた',
  };

  const esc = (s) => String(s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---- 1件ずつ処理 ----
  const form = document.getElementById('form');
  const input = document.getElementById('address');
  const btn = document.getElementById('submit-btn');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');

  async function run(address) {
    if (!address) return;
    btn.disabled = true;
    statusEl.textContent = '処理中…';
    resultEl.innerHTML = '';
    try {
      const n = await normalize(address);
      const full = `${n.pref ?? ''}${n.city ?? ''}${n.town ?? ''}${n.addr ?? ''}`;
      const rows = [
        ['都道府県', n.pref ?? ''],
        ['市区町村', n.city ?? ''],
        ['町字（大字・丁目）', n.town ?? ''],
        ['街区符号・住居符号／地番', n.addr ?? ''],
        ['正規化済み住所（連結）', full],
        ['正規化レベル', `${n.level}（${LEVEL_DESC[n.level] ?? ''}）`],
        ['緯度・経度', n.point ? `${n.point.lat}, ${n.point.lng}` : '—'],
        ['正規化できなかった部分', n.other || '（なし）'],
      ];
      resultEl.innerHTML =
        `<table><tbody>` +
        rows.map(([k, v]) =>
          `<tr><th>${esc(k)}</th><td class="copy-cell"><span class="val">${esc(v)}</span> <button type="button" class="copy" data-copy="${esc(v)}">コピー</button></td></tr>`
        ).join('') +
        `</tbody></table>` +
        `<p class="json-label">生データ（JSON）</p>` +
        `<pre>${esc(JSON.stringify(n, null, 2))}</pre>`;
    } catch (err) {
      resultEl.innerHTML = `<p class="error">エラー: ${esc(String(err?.message ?? err))}</p>`;
    } finally {
      statusEl.textContent = '';
      btn.disabled = false;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    run(input.value.trim());
  });

  document.querySelectorAll('button.ex').forEach(b => {
    b.addEventListener('click', () => {
      input.value = b.textContent;
      run(b.textContent);
    });
  });

  resultEl.addEventListener('click', async (e) => {
    const t = e.target.closest('button.copy');
    if (!t) return;
    try {
      await navigator.clipboard.writeText(t.dataset.copy);
      t.textContent = 'コピーしました';
      setTimeout(() => { t.textContent = 'コピー'; }, 1200);
    } catch {
      t.textContent = 'コピーに失敗';
    }
  });

  // ---- 一括処理 ----
  const MAX_LABEL = document.getElementById('max-lines-label');
  MAX_LABEL.textContent = String(MAX_BATCH_LINES);

  const batchInput = document.getElementById('batch-input');
  const batchBtn = document.getElementById('batch-btn');
  const batchClearBtn = document.getElementById('batch-clear-btn');
  const batchStatus = document.getElementById('batch-status');
  const batchResult = document.getElementById('batch-result');
  const progressWrap = document.getElementById('batch-progress-wrap');
  const progressBar = document.getElementById('batch-progress');
  const progressLabel = document.getElementById('batch-progress-label');

  let batchRows = []; // 直近の一括処理結果（CSV/TSV 出力用に保持）

  batchClearBtn.addEventListener('click', () => {
    batchInput.value = '';
    batchStatus.textContent = '';
    batchResult.innerHTML = '';
    batchRows = [];
    progressWrap.classList.remove('active');
  });

  batchBtn.addEventListener('click', async () => {
    const lines = batchInput.value
      .split(/\r\n|\r|\n/)
      .map(s => s.trim())
      .filter(Boolean);

    if (lines.length === 0) {
      batchStatus.textContent = '';
      batchResult.innerHTML = `<p class="error">住所を入力してください。</p>`;
      return;
    }
    if (lines.length > MAX_BATCH_LINES) {
      batchStatus.textContent = '';
      batchResult.innerHTML = `<p class="error">1度に処理できるのは ${MAX_BATCH_LINES} 件までです（現在 ${lines.length} 件）。</p>`;
      return;
    }

    batchBtn.disabled = true;
    batchResult.innerHTML = '';
    batchRows = [];
    progressBar.max = lines.length;
    progressBar.value = 0;
    progressWrap.classList.add('active');

    // 1件ずつ順次処理（データ取得の混雑を避けるため並列にはしない）
    for (let i = 0; i < lines.length; i++) {
      progressLabel.textContent = `処理中… ${i + 1}/${lines.length}`;
      try {
        const n = await normalize(lines[i]);
        batchRows.push({
          input: lines[i],
          ok: true,
          pref: n.pref ?? '',
          city: n.city ?? '',
          town: n.town ?? '',
          addr: n.addr ?? '',
          full: `${n.pref ?? ''}${n.city ?? ''}${n.town ?? ''}${n.addr ?? ''}`,
          level: n.level,
          lat: n.point?.lat ?? '',
          lng: n.point?.lng ?? '',
          other: n.other ?? '',
          error: '',
        });
      } catch (err) {
        batchRows.push({
          input: lines[i], ok: false,
          pref: '', city: '', town: '', addr: '', full: '',
          level: '', lat: '', lng: '', other: '',
          error: String(err?.message ?? err),
        });
      }
      progressBar.value = i + 1;
      // UI を固めないため、ときどき描画を譲る
      if ((i + 1) % 20 === 0) await new Promise(r => setTimeout(r, 0));
    }

    progressLabel.textContent = '完了';
    setTimeout(() => progressWrap.classList.remove('active'), 1500);
    batchBtn.disabled = false;

    const okCount = batchRows.filter(r => r.ok).length;
    const ngCount = batchRows.length - okCount;

    const body = batchRows.map((r, i) => {
      if (!r.ok) {
        return `<tr><td class="num">${i + 1}</td><td>${esc(r.input)}</td>` +
          `<td class="err" colspan="5">エラー: ${esc(r.error)}</td></tr>`;
      }
      return `<tr><td class="num">${i + 1}</td><td>${esc(r.input)}</td>` +
        `<td>${esc(r.full)}</td>` +
        `<td class="num" title="${esc(LEVEL_DESC[r.level] ?? '')}">${esc(r.level)}</td>` +
        `<td>${esc(r.other || '—')}</td>` +
        `<td class="ok">OK</td>` +
        `<td class="num">${esc(r.lat ? `${r.lat}, ${r.lng}` : '—')}</td></tr>`;
    }).join('');

    batchStatus.textContent = '';
    batchResult.innerHTML =
      `<p class="summary">成功 <strong>${okCount}</strong> 件 / 失敗 <strong>${ngCount}</strong> 件（合計 ${batchRows.length} 件）</p>` +
      `<table class="batch-table"><thead><tr>` +
      `<th>#</th><th>入力住所</th><th>正規化済み住所</th><th>レベル</th><th>判別不能部分</th><th>結果</th><th>緯度・経度</th>` +
      `</tr></thead><tbody>${body}</tbody></table>` +
      `<div class="batch-actions">` +
      `<button type="button" id="csv-btn">CSVダウンロード</button>` +
      `<button type="button" id="tsv-btn">TSVをコピー</button>` +
      `<button type="button" id="batch-json-btn">JSONをコピー</button>` +
      `</div>`;

    document.getElementById('csv-btn').addEventListener('click', downloadCsv);
    document.getElementById('tsv-btn').addEventListener('click', copyTsv);
    document.getElementById('batch-json-btn').addEventListener('click', copyJson);
  });

  // ---- 一括結果のエクスポート ----
  const CSV_HEADER = ['入力住所', '都道府県', '市区町村', '町字', '街区符号・住居符号／地番',
    '正規化済み住所', '正規化レベル', '緯度', '経度', '判別不能部分', 'エラー'];

  const rowToCells = (r) => [
    r.input, r.pref, r.city, r.town, r.addr, r.full,
    r.level, r.lat, r.lng, r.other, r.error,
  ];

  const csvEscape = (s) => {
    s = String(s ?? '');
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };

  function downloadCsv() {
    const lines = [CSV_HEADER, ...batchRows.map(rowToCells)]
      .map(cells => cells.map(csvEscape).join(','));
    // BOM 付き UTF-8（Excel で開いたときの文字化け対策）
    const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'abr-normalized.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  async function copyTsv() {
    const tsv = [CSV_HEADER, ...batchRows.map(rowToCells)]
      .map(cells => cells.map(c => String(c ?? '').replace(/[\t\r\n]/g, ' ')).join('\t'))
      .join('\r\n');
    try {
      await navigator.clipboard.writeText(tsv);
    } catch { /* ignore */ }
  }

  async function copyJson() {
    try {
      await navigator.clipboard.writeText(JSON.stringify(batchRows, null, 2));
    } catch { /* ignore */ }
  }
</script>
</body>
</html>
